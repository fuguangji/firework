<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Firework GUI Editor</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<!-- 🎛 GUI -->
<div id="panel">
  <h3>🎆 Firework Editor</h3>

  <label>Shape</label>
  <select id="shape">
    <option>sphere</option>
    <option>ring</option>
    <option>palm</option>
    <option>chrysanthemum</option>
    <option>willow</option>
    <option>crackle</option>
    <option>strobe</option>
    <option>heart</option>
    <option>peony</option>
    <option>random</option>
  </select>

  <label>Count</label>
  <input id="count" type="range" min="50" max="1000" value="300">

  <label>Speed</label>
  <input id="speed" type="range" min="1" max="15" value="6">

  <label>Gravity</label>
  <input id="gravity" type="range" min="-10" max="0" value="-3">

  <button id="fireBtn">💥 Fire</button>
</div>

<!-- ☰ toggle -->
<div id="toggle">☰</div>

<!-- 3D -->
<script type="module" src="./app.js"></script>

</body>
</html>
