<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stable Firework</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="panel">
  <h3>Firework</h3>

  <select id="shape">
    <option>sphere</option>
    <option>ring</option>
    <option>palm</option>
    <option>random</option>
  </select>

  <input id="count" type="range" min="50" max="500" value="200">
  <input id="speed" type="range" min="1" max="10" value="5">
  <input id="gravity" type="range" min="-10" max="0" value="-3">

  <button id="fireBtn">FIRE</button>
</div>

<div id="toggle">☰</div>

<script type="module" src="app.js"></script>

</body>
</html>
