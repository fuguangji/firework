<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>齁齁 ( pig is cute 生日快樂🎁🎈🎊🎂！！！</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }
        .glow-title {
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.6), 0 0 60px rgba(147, 51, 234, 0.4);
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden flex flex-col justify-between items-center text-white relative">
    <audio id="bgm" src="./bg.mp3" loop preload="auto"></audio>
    <!-- 中央標題與祝賀語 -->
    <div class="z-10 text-center mt-14 md:mt-20 pointer-events-none px-4">
        <div class="inline-block mb-3 px-5 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-pink-300 text-xs md:text-sm tracking-widest uppercase animate-pulse shadow-lg">
            ✨ 希望你有美好的一天！以及...會考順利～ ✨
        </div>
        <h1 class="text-5xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-rose-300 to-amber-200 glow-title tracking-widest mb-4">
            齁齁 ( pig is cute 生日快樂～～～！
        </h1>
        <p class="text-gray-300 text-base md:text-xl font-light tracking-wide drop-shadow-md">
            點擊畫面任意處施放煙火
        </p>
    </div>

    <!-- 底部控制按鈕列 -->
    <div class="z-10 mb-10 flex gap-4 pointer-events-auto">
        <button id="musicBtn" onclick="toggleMusic()" class="px-7 py-3.5 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 font-semibold rounded-full shadow-lg transform hover:scale-105 active:scale-95 transition-all duration-300 cursor-pointer text-sm md:text-base">
        🎵 播放音樂
        </button>
        <button onclick="launchGrandFinale()" class="px-7 py-3.5 bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 hover:opacity-90 font-semibold rounded-full shadow-lg shadow-pink-500/40 transform hover:scale-105 active:scale-95 transition-all duration-300 border border-pink-400/30 cursor-pointer text-sm md:text-base">
            施放煙火秀🎆！
        </button>
    </div>

    <!-- 渲染容器 -->
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let fireworks = [];
        let stars;
        let ambientLight, pointLight;
        

       
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. 場景設置
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010105, 0.012);

            // 2. 相機設置
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 22);

            // 3. 渲染器設置 (啟用 ToneMapping 與陰影以呈現寫實感)
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // 4. 動態光影 (模擬煙火爆炸時的光照閃爍)
            ambientLight = new THREE.AmbientLight(0x050510, 1.5);
            scene.add(ambientLight);

            pointLight = new THREE.PointLight(0xff5588, 0, 40);
            pointLight.position.set(0, 5, 5);
            scene.add(pointLight);

            // 5.  星空
            createStarfield();

            // 6. 事件監聽
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                const coords = getNormalizedCoords(e.clientX, e.clientY);
                launchRocket(coords.x * 12, -8, (Math.random() - 0.5) * 5, coords.x * 3, Math.random() * 8 + 6);
            });

            animate();
        }

        function getNormalizedCoords(clientX, clientY) {
            return {
                x: (clientX / window.innerWidth) * 2 - 1,
                y: -(clientY / window.innerHeight) * 2 + 1
            };
        }

        function createStarfield() {
            const geometry = new THREE.BufferGeometry();
            const count = 1200;
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 80;
                positions[i + 1] = Math.random() * 40 - 5;
                positions[i + 2] = (Math.random() - 0.5) * 80;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                color: 0x8899bb,
                size: 0.1,
                transparent: true,
                opacity: 0.6
            });
            stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }

        // 寫實煙火類別 (包含升空、爆炸、重力加速度、拖尾與光芒衰減)
        class RealisticFirework {
            constructor(startX, startY, startZ, targetX, targetY, targetZ) {
                this.isExploded = false;
                this.position = new THREE.Vector3(startX, startY, startZ);
                this.target = new THREE.Vector3(targetX, targetY, targetZ);
                
                // 升空軌跡速度
                const dir = new THREE.Vector3().subVectors(this.target, this.position);
                const distance = dir.length();
                dir.normalize();
                this.velocity = dir.multiplyScalar(distance * 0.045);

                // 建立升空彈頭點陣
                const rocketGeo = new THREE.BufferGeometry();
                rocketGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([startX, startY, startZ]), 3));
                this.rocketMat = new THREE.PointsMaterial({
                    color: 0xffeedd,
                    size: 0.25,
                    transparent: true,
                    opacity: 1
                });
                this.rocketMesh = new THREE.Points(rocketGeo, this.rocketMat);
                scene.add(this.rocketMesh);

                this.particles = null;
                this.particleGeo = null;
                this.particleMat = null;
                this.alpha = 1;
                this.color = new THREE.Color();
            }

            update() {
                if (!this.isExploded) {
                    this.position.add(this.velocity);
                    const posAttr = this.rocketMesh.geometry.attributes.position;
                    posAttr.setXYZ(0, this.position.x, this.position.y, this.position.z);
                    posAttr.needsUpdate = true;

                    // 到達目標高度或速度耗盡時爆炸
                    if (this.position.y >= this.target.y || this.velocity.y <= 0) {
                        scene.remove(this.rocketMesh);
                        this.explode();
                    }
                } else {
                    // 爆炸後粒子物理模擬
                    const positions = this.particleGeo.attributes.position.array;
                    const velocities = this.particleVelocities;
                    
                    this.alpha -= 0.012;
                    this.particleMat.opacity = Math.max(this.alpha, 0);

                    for (let i = 0; i < positions.length / 3; i++) {
                        velocities[i * 3 + 1] -= 0.0035; // 重力
                        velocities[i * 3] *= 0.97;      // 空氣阻力
                        velocities[i * 3 + 1] *= 0.97;
                        velocities[i * 3 + 2] *= 0.97;

                        positions[i * 3] += velocities[i * 3];
                        positions[i * 3 + 1] += velocities[i * 3 + 1];
                        positions[i * 3 + 2] += velocities[i * 3 + 2];
                    }
                    this.particleGeo.attributes.position.needsUpdate = true;
                }
            }

            explode() {
                this.isExploded = true;
                const count = 350;
                this.particleGeo = new THREE.BufferGeometry();
                const positions = new Float32Array(count * 3);
                this.particleVelocities = new Float32Array(count * 3);

                // 隨機豐富色系
                const colorsList = [0xff3366, 0xff9933, 0xffff66, 0x33ccff, 0xcc66ff, 0xffffff];
                this.color.set(colorsList[Math.floor(Math.random() * colorsList.length)]);

                // 點亮環境光影瞬間
                pointLight.position.copy(this.position);
                pointLight.color.copy(this.color);
                pointLight.intensity = 5;

                for (let i = 0; i < count; i++) {
                    positions[i * 3] = this.position.x;
                    positions[i * 3 + 1] = this.position.y;
                    positions[i * 3 + 2] = this.position.z;

                    // 球形擴散速度
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    const speed = Math.random() * 0.28 + 0.05;

                    this.particleVelocities[i * 3] = speed * Math.sin(phi) * Math.cos(theta);
                    this.particleVelocities[i * 3 + 1] = speed * Math.sin(phi) * Math.sin(theta);
                    this.particleVelocities[i * 3 + 2] = speed * Math.cos(phi);
                }

                this.particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                
                // 採用 additive blending 讓重疊處發光，呈現真實煙火亮麗感
                this.particleMat = new THREE.PointsMaterial({
                    color: this.color,
                    size: 0.18,
                    transparent: true,
                    opacity: 1,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.particles = new THREE.Points(this.particleGeo, this.particleMat);
                scene.add(this.particles);
            }

            destroy() {
                if (this.isExploded) {
                    scene.remove(this.particles);
                    this.particleGeo.dispose();
                    this.particleMat.dispose();
                } else {
                    scene.remove(this.rocketMesh);
                }
            }
        }

        function launchRocket(startX, startY, startZ, targetX, targetY) {
            fireworks.push(new RealisticFirework(startX, startY, startZ, targetX, targetY, (Math.random() - 0.5) * 3));
        }

        window.launchGrandFinale = function() {
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const x = (Math.random() - 0.5) * 16;
                    launchRocket((Math.random() - 0.5) * 8, -8, 0, x, Math.random() * 6 + 4);
                }, i * 200);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }


        // 動畫迴圈
        function animate() {
            requestAnimationFrame(animate);

            // 環境光影衰減
            if (pointLight.intensity > 0) {
                pointLight.intensity *= 0.92;
            }

            // 更新煙火
            for (let i = fireworks.length - 1; i >= 0; i--) {
                let fw = fireworks[i];
                fw.update();
                if (fw.isExploded && fw.alpha <= 0) {
                    fw.destroy();
                    fireworks.splice(i, 1);
                }
            }

            // 隨機自動施放煙火
            if (Math.random() < 0.035 && fireworks.length < 5) {
                const rx = (Math.random() - 0.5) * 16;
                const ry = Math.random() * 5 + 3;
                launchRocket((Math.random() - 0.5) * 10, -8, 0, rx, ry);
            }

            renderer.render(scene, camera);
        }
        const bgm = document.getElementById("bgm");
bgm.volume = 0;

function toggleMusic() {
    const btn = document.getElementById("musicBtn");

    if (bgm.paused) {
        bgm.play().then(() => {
            btn.textContent = "好好享受～";
            fadeInMusic();
        });
    } 
}

function fadeInMusic() {
    bgm.volume = 0;

    const timer = setInterval(() => {
        bgm.volume = Math.min(bgm.volume + 0.05, 0.8);

        if (bgm.volume >= 0.8) {
            clearInterval(timer);
        }
    }, 100);
}

function fadeOutMusic(callback) {
    const timer = setInterval(() => {
        bgm.volume = Math.max(bgm.volume - 0.05, 0);

        if (bgm.volume <= 0) {
            clearInterval(timer);
            callback();
        }
    }, 100);
}
     
        window.onload = init;
    </script>
</body>
</html>
